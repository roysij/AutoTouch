name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk AutoTouch.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouch-apk
          path: AutoTouch.apk

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AutoTouch (latest build)
          body: Built automatically from commit ${{ github.sha }}. Download AutoTouch.apk below and open it on your phone.
          prerelease: false
          make_latest: true
          files: AutoTouch.apk
